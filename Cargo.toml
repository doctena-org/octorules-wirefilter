[package]
name = "octorules-wirefilter"
version = "0.7.0"
edition = "2024"
license = "Apache-2.0"
description = "Wirefilter expression parser FFI bindings for octorules"
authors = ["Martin Simon", "Doctena S.A."]
repository = "https://github.com/doctena-org/octorules-wirefilter"
homepage = "https://github.com/doctena-org/octorules-wirefilter"
keywords = ["cloudflare", "wirefilter", "parser", "ffi"]
categories = ["parser-implementations", "api-bindings"]
rust-version = "1.86"
exclude = [".github/", "tests/"]

[lib]
name = "octorules_wirefilter"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module"] }
# Pinned to specific commit: SchemeBuilder and function registration APIs
# are not in the published crates.io wirefilter-engine v0.7.0.
# default-features = false skips get-size2 (LhsValue memory accounting, an
# execution-side concern; we only parse). "regex" stays: the scheme has
# regex-typed fields and matches() support.
wirefilter-engine = { git = "https://github.com/cloudflare/wirefilter", rev = "2efaf3b6b80fde0e9fcf091abe5292fb95d7eae6", default-features = false, features = ["regex"] }
